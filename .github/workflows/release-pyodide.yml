name: Release Pyodide Wheel

on:
  push:
    branches:
      - pyodide
    tags:
      - 'v*'   # triggers on any tag like v1.0.0, v1.2.3-beta, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build package
        run: python -m pip install --upgrade pip build

      - name: Build pure-Python wheel
        working-directory: src/subpackages/library/
        run: python -m build

      # Always upload the wheel as a workflow artifact (available on branch pushes too)
      - name: Upload wheel as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyodide-wheel
          path: src/subpackages/library/dist/*.whl

      # On a tag push: create a GitHub Release and attach the wheel
      - name: Create GitHub Release and upload wheel
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "cellprofiler-library ${{ github.ref_name }}"
          generate_release_notes: true
          files: src/subpackages/library/dist/*.whl
